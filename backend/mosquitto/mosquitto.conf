# Mosquitto configuration for the virtual restaurant.
#
# Two listeners are exposed:
#   1883 (plain MQTT)      - used by the backend service and by test tooling
#                             running inside the docker network / on localhost.
#   9001 (MQTT over WebSockets) - used by browser (frontend) clients, per the
#                             "MQTT over WebSockets only" communication requirement.
#
# Anonymous access is disabled; every client must authenticate via
# password_file, and topic access is further restricted via acl_file so that:
#   - each table's frontend client can only publish/subscribe on its own topics
#   - only the backend can publish FOOD / rejection events
#
# See backend/README.md for how to (re)generate mosquitto/passwd.

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

# Keep individual message payloads small; defense in depth alongside the
# application-level food_name length cap (see src/config.py).
message_size_limit 8192

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

listener 1883
protocol mqtt

listener 9001
protocol websockets
