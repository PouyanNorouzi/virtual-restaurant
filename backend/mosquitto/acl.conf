# Topic ACLs, keyed by authenticated username (see mosquitto/passwd), plus
# a small set of file-scope "pattern" rules applied to every authenticated
# client regardless of username.
#
# Every browser client authenticates as the single shared "customer" user
# below (baked into the frontend's build config - it is NOT a per-customer
# secret, anyone can read it out of the frontend bundle), with its ACL
# broadened to ALL table topics rather than one table each. Which table a
# session may order from is decided dynamically by SeatingService, so the
# broker doesn't enforce "session X may only order from table Y" - that
# check lives in OrderService.validate() instead (rejection reason:
# "not_seated_at_table"), which asks SeatingService whether the ordering
# session is actually seated at that table. See backend/README.md Security
# section for the full trade-off discussion (this vs. Mosquitto's
# dynamic-security plugin).
#
# Per-session isolation for the seating control topics (request/vacate/
# status) is provided via the "pattern" rules at the bottom of this file,
# using Mosquitto's %c substitution (the connecting client's MQTT Client
# Identifier). By protocol convention, every customer's session_id IS its
# Client Identifier - see topics.py and README - so these patterns
# statically grant each session access to ONLY its own seating topics, with
# no per-client "user" blocks and no dynamic provisioning. This is only
# sound if session ids are unguessable (client-generated random UUIDs,
# never leaked via a URL/log) - documented explicitly in backend/README.md.
#
# NUM_TABLES (src/config.py) doesn't need to appear anywhere below: neither
# the backend's nor the customer's grants are per-table.

# Backend: the only client allowed to announce food readiness, rejections,
# seat status, and occupancy; the only client allowed to see orders and
# seat requests/vacates across every table/session.
user backend
topic read restaurant/table/+/order
topic write restaurant/table/+/order/accepted
topic write restaurant/table/+/food
topic write restaurant/table/+/order/rejected
topic read restaurant/seating/+/request
topic read restaurant/seating/+/vacate
topic read restaurant/seating/+/finished
topic write restaurant/seating/+/status
topic write restaurant/seating/occupancy

# Shared customer role: every browser client. Broad on table topics
# (per-table isolation is enforced by OrderService, not the broker, since
# table assignment is dynamic); read-only on the occupancy broadcast.
user customer
topic write restaurant/table/+/order
topic read restaurant/table/+/order/accepted
topic read restaurant/table/+/food
topic read restaurant/table/+/order/rejected
topic read restaurant/seating/occupancy

# Per-session seating topics: %c = the connection's own MQTT Client
# Identifier. Applies to every authenticated client, but only a customer
# connection's own chosen identifier (== its session_id) will ever match
# its own seating topics.
pattern write restaurant/seating/%c/request
pattern write restaurant/seating/%c/vacate
pattern write restaurant/seating/%c/finished
pattern read restaurant/seating/%c/status
